<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Burgos</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <!-- ---------- LOGIN ---------- -->
    <div id="loginScreen" class="login-wrap">
      <form id="loginForm" class="login-card">
        <p class="brand-mark mb-1">/ Burgos /</p>
        <h1 class="h4 mb-3">Panel de administración</h1>
        <label for="tokenInput" class="form-label small text-muted-custom">Token de acceso</label>
        <input type="password" id="tokenInput" class="form-control app-input mb-3" autocomplete="off" required />
        <button type="submit" class="btn-neon w-100">Ingresar</button>
        <p id="loginError" class="text-danger small mt-3 mb-0 d-none"></p>
      </form>
    </div>

    <!-- ---------- DASHBOARD ---------- -->
    <div id="dashboard" class="d-none">
      <nav class="admin-topbar d-flex align-items-center justify-content-between px-3 px-md-4">
        <span class="brand-mark">/ Burgos / <span class="text-muted-custom fw-normal">admin</span></span>
        <button id="logoutBtn" class="btn-neon-outline btn-sm">Cerrar sesión</button>
      </nav>

      <div class="container-fluid">
        <div class="row">
          <aside class="col-12 col-md-2 admin-sidebar">
            <button class="admin-tab active" data-tab="profile"><i class="bi bi-person-badge"></i> Perfil</button>
            <button class="admin-tab" data-tab="skills"><i class="bi bi-bar-chart"></i> Habilidades</button>
            <button class="admin-tab" data-tab="experience"><i class="bi bi-clock-history"></i> Experiencia</button>
            <button class="admin-tab" data-tab="achievements"><i class="bi bi-trophy"></i> Logros</button>
            <button class="admin-tab" data-tab="projects"><i class="bi bi-folder2-open"></i> Proyectos</button>
            <button class="admin-tab" data-tab="messages"><i class="bi bi-envelope"></i> Mensajes</button>
          </aside>

          <main class="col-12 col-md-10 py-4">
            <div id="statusMsg" class="alert-floating d-none"></div>

            <!-- PERFIL -->
            <section id="panel-profile" class="admin-panel">
              <h2 class="h5 mb-3">Perfil</h2>
              <form id="profileForm" class="row g-3"></form>
            </section>

            <!-- HABILIDADES -->
            <section id="panel-skills" class="admin-panel d-none">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Habilidades</h2>
                <button class="btn-neon btn-sm" data-new="skills"><i class="bi bi-plus-lg"></i> Nueva</button>
              </div>
              <div id="form-skills" class="surface p-3 mb-3 d-none"></div>
              <div id="table-skills"></div>
            </section>

            <!-- EXPERIENCIA -->
            <section id="panel-experience" class="admin-panel d-none">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Experiencia</h2>
                <button class="btn-neon btn-sm" data-new="experience"><i class="bi bi-plus-lg"></i> Nueva</button>
              </div>
              <div id="form-experience" class="surface p-3 mb-3 d-none"></div>
              <div id="table-experience"></div>
            </section>

            <!-- LOGROS -->
            <section id="panel-achievements" class="admin-panel d-none">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Logros</h2>
                <button class="btn-neon btn-sm" data-new="achievements"><i class="bi bi-plus-lg"></i> Nuevo</button>
              </div>
              <div id="form-achievements" class="surface p-3 mb-3 d-none"></div>
              <div id="table-achievements"></div>
            </section>

            <!-- PROYECTOS -->
            <section id="panel-projects" class="admin-panel d-none">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Proyectos</h2>
                <button class="btn-neon btn-sm" data-new="projects"><i class="bi bi-plus-lg"></i> Nuevo</button>
              </div>
              <div id="form-projects" class="surface p-3 mb-3 d-none"></div>
              <div id="table-projects"></div>
            </section>

            <!-- MENSAJES -->
            <section id="panel-messages" class="admin-panel d-none">
              <h2 class="h5 mb-3">Mensajes recibidos</h2>
              <div id="table-messages"></div>
            </section>
          </main>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
